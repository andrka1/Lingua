name: Deploy Lingua to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # Не пересобираем сайт из-за изменений только в других workflow-файлах
    paths-ignore:
      - ".github/workflows/android.yml"
      - "**/*.md"

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно только один деплой; новый отменяет предыдущий незавершённый
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # SPA-фолбэк: на 404 отдаём index.html, чтобы работал HashRouter/прямые ссылки
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
