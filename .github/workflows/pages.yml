name: Deploy Lingua to GitHub Pages
​
# Автоматически собирает и публикует сайт при пуше в main/master,
# а также по кнопке во вкладке Actions (workflow_dispatch).
on:
  push:
    branches: [main, master]
  workflow_dispatch:
​
# Права, необходимые для публикации в GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write
​
# Не запускать несколько деплоев одновременно; новый отменяет старый.
concurrency:
  group: pages
  cancel-in-progress: true
​
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
​
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
​
      - name: Install dependencies
        run: npm ci
​
      - name: Type-check
        run: npm run typecheck
​
      - name: Build application
        run: npm run build
​
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
​
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
​
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
​
